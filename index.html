<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="./">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plantora - Intelligent Plant Identification & Agricultural Marketplace">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Plantora">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Plantora — Smart Agriculture & Botanical Marketplace</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Sign-in Client ID -->
  <meta name="google-signin-client_id" content="946947936252-kfe7ro8l6lvuutp82hdtigevn6c329c9.apps.googleusercontent.com" />

  <!-- Apple Sign-in JS -->
  <script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>

  <!-- Facebook SDK (Initializes only if configured with a real Facebook App ID) -->
  <script>
    var FB_APP_ID = '123456789012345'; // Replace with your real Facebook App ID
    if (FB_APP_ID && FB_APP_ID !== '123456789012345') {
      window.fbAsyncInit = function() {
        FB.init({
          appId      : FB_APP_ID,
          cookie     : true,
          xfbml      : true,
          version    : 'v16.0'
        });
      };
      (function(d, s, id){
         var js, fjs = d.getElementsByTagName(s)[0];
         if (d.getElementById(id)) {return;}
         js = d.createElement(s); js.id = id;
         js.src = "https://connect.facebook.net/en_US/sdk.js";
         fjs.parentNode.insertBefore(js, fjs);
       }(document, 'script', 'facebook-jssdk'));
    }
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b140e;
      overflow: hidden;
    }
    #loading-indicator {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #132419 0%, #080f0a 100%);
      color: #f0fdf4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      z-index: 999999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #loading-indicator.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .app-icon {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(34, 197, 94, 0.25);
      animation: pulse 2s infinite ease-in-out;
    }
    .app-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #22c55e;
      margin-bottom: 6px;
    }
    .app-sub {
      font-size: 13px;
      color: #86efac;
      margin-bottom: 24px;
      opacity: 0.85;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(34, 197, 94, 0.2);
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <!-- Clean branded loading screen while Flutter WASM and JS load -->
  <div id="loading-indicator">
    <img src="favicon.png" alt="Plantora" class="app-icon" />
    <div class="app-title">Plantora</div>
    <div class="app-sub">Loading application...</div>
    <div class="spinner"></div>
  </div>

  <script>
    function removeLoader() {
      var loader = document.getElementById('loading-indicator');
      if (loader && !loader.classList.contains('loaded')) {
        loader.classList.add('loaded');
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 500);
      }
    }

    // Remove loader when Flutter renders its first frame
    window.addEventListener('flutter-first-frame', removeLoader);

    // Observer fallback if flutter-first-frame event is missed
    var observer = new MutationObserver(function() {
      if (document.querySelector('flutter-view, flt-glass-pane')) {
        removeLoader();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Safety timeout fallback
    setTimeout(removeLoader, 15000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
